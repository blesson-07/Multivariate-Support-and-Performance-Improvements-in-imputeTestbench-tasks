<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>✨ Happiness ✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0e0b1a;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            overflow: hidden;
            user-select: none;
            cursor: default;
        }

        /* ─── Animated background ─── */
        .bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at 20% 30%, #1e1338, #0b0820 70%);
            animation: bgPulse 10s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% {
                opacity: 0.8;
                transform: scale(1);
            }
            100% {
                opacity: 1;
                transform: scale(1.02);
            }
        }

        /* ─── Floating orbs ─── */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
            animation: orbFloat 16s ease-in-out infinite alternate;
        }
        .orb--1 {
            width: 600px;
            height: 600px;
            top: -20%;
            left: -10%;
            background: #ff3b8a;
            opacity: 0.2;
        }
        .orb--2 {
            width: 500px;
            height: 500px;
            bottom: -20%;
            right: -10%;
            background: #7b2ffc;
            opacity: 0.15;
            animation-delay: -6s;
        }
        .orb--3 {
            width: 400px;
            height: 400px;
            top: 40%;
            left: 60%;
            background: #00d4ff;
            opacity: 0.15;
            animation-delay: -12s;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(60px, -40px) scale(1.1);
            }
            66% {
                transform: translate(-40px, 60px) scale(0.9);
            }
            100% {
                transform: translate(30px, -30px) scale(1.05);
            }
        }

        /* ─── Main content ─── */
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
            max-width: 800px;
            animation: fadeIn 1.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(50px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ─── Title ─── */
        .main-title {
            font-size: clamp(2.8rem, 12vw, 6.5rem);
            font-weight: 900;
            line-height: 1.1;
            color: #fff;
            text-shadow:
                0 0 40px rgba(255, 59, 138, 0.4),
                0 0 80px rgba(123, 47, 252, 0.3),
                0 0 150px rgba(0, 212, 255, 0.2);
            animation: titleGlow 3s ease-in-out infinite alternate;
            margin-bottom: 0.4rem;
        }

        @keyframes titleGlow {
            0% {
                text-shadow:
                    0 0 40px rgba(255, 59, 138, 0.4),
                    0 0 80px rgba(123, 47, 252, 0.3),
                    0 0 150px rgba(0, 212, 255, 0.2);
                transform: scale(1);
            }
            100% {
                text-shadow:
                    0 0 60px rgba(255, 59, 138, 0.7),
                    0 0 120px rgba(123, 47, 252, 0.5),
                    0 0 200px rgba(0, 212, 255, 0.35);
                transform: scale(1.02);
            }
        }

        .rainbow-text {
            background: linear-gradient(90deg,
                    #ff3b8a, #ff6b35, #ffd93d, #6bcb77,
                    #4d96ff, #9b59b6, #ff3b8a);
            background-size: 400% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: rainbowFlow 6s linear infinite;
            display: inline-block;
        }

        @keyframes rainbowFlow {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 400% 50%;
            }
        }

        /* ─── Subtitle ─── */
        .subtitle {
            font-size: clamp(1rem, 2.2vw, 1.8rem);
            font-weight: 300;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 0.15em;
            margin-top: 0.2rem;
            margin-bottom: 2.5rem;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(6px);
            padding: 0.5rem 1.8rem;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: inline-block;
            animation: subtitlePulse 3s ease-in-out infinite alternate;
        }

        @keyframes subtitlePulse {
            0% {
                opacity: 0.6;
                transform: scale(1);
            }
            100% {
                opacity: 1;
                transform: scale(1.04);
            }
        }

        /* ─── Message display ─── */
        .message-box {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            padding: 1.8rem 2.5rem;
            margin: 1.8rem auto;
            max-width: 550px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transition: all 0.4s ease;
            position: relative;
        }

        .message-box:hover {
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 30px 80px rgba(123, 47, 252, 0.15);
        }

        #message {
            font-size: clamp(1.2rem, 3.2vw, 2.4rem);
            font-weight: 600;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            line-height: 1.5;
            word-break: break-word;
            transition: opacity 0.3s ease;
            min-height: 3.5rem;
        }

        .message-emoji {
            font-size: 2.2rem;
            margin-right: 0.6rem;
            display: inline-block;
            animation: emojiWiggle 2s ease-in-out infinite;
        }

        @keyframes emojiWiggle {
            0%,
            100% {
                transform: rotate(-6deg);
            }
            50% {
                transform: rotate(6deg);
            }
        }

        /* ─── Button ─── */
        .btn {
            background: linear-gradient(135deg, #ff3b8a, #7b2ffc);
            border: none;
            padding: 1.1rem 3rem;
            border-radius: 60px;
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 40px rgba(123, 47, 252, 0.3);
            position: relative;
            overflow: hidden;
            margin-top: 0.6rem;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
        }

        .btn:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 16px 60px rgba(123, 47, 252, 0.5);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: -50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }

        .btn:hover::after {
            opacity: 1;
        }

        .btn-icon {
            font-size: 1.6rem;
            display: inline-block;
            animation: bounceIcon 1.6s ease-in-out infinite;
        }

        @keyframes bounceIcon {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-5px);
            }
        }

        /* ─── Floating emoji decorations ─── */
        .floating-emoji {
            position: fixed;
            font-size: 2rem;
            pointer-events: none;
            z-index: 0;
            opacity: 0.08;
            animation: floatAround 30s linear infinite;
        }

        .floating-emoji:nth-child(1) {
            top: 8%;
            left: 4%;
            animation-duration: 28s;
            font-size: 3rem;
        }
        .floating-emoji:nth-child(2) {
            bottom: 10%;
            right: 3%;
            animation-duration: 32s;
            animation-delay: -6s;
        }
        .floating-emoji:nth-child(3) {
            top: 40%;
            left: 92%;
            animation-duration: 25s;
            animation-delay: -12s;
            font-size: 2.4rem;
        }
        .floating-emoji:nth-child(4) {
            top: 70%;
            left: 5%;
            animation-duration: 30s;
            animation-delay: -18s;
        }
        .floating-emoji:nth-child(5) {
            top: 15%;
            left: 50%;
            animation-duration: 35s;
            animation-delay: -4s;
            font-size: 4rem;
            opacity: 0.05;
        }

        @keyframes floatAround {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(80px, -60px) rotate(90deg);
            }
            50% {
                transform: translate(-40px, 80px) rotate(180deg);
            }
            75% {
                transform: translate(60px, 40px) rotate(270deg);
            }
            100% {
                transform: translate(-30px, -70px) rotate(360deg);
            }
        }

        /* ─── Canvas for particles & hearts ─── */
        #happiness-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            width: 100%;
            height: 100%;
        }

        /* ─── Responsive ─── */
        @media (max-width: 600px) {
            .message-box {
                padding: 1.2rem 1.5rem;
                min-height: 80px;
            }
            .btn {
                padding: 0.9rem 2rem;
                font-size: 1.1rem;
            }
            .floating-emoji {
                display: none;
            }
            .subtitle {
                font-size: 0.8rem;
                padding: 0.3rem 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- ─── Background layers ─── -->
    <div class="bg-canvas"></div>
    <div class="orb orb--1"></div>
    <div class="orb orb--2"></div>
    <div class="orb orb--3"></div>

    <!-- ─── Floating emojis ─── -->
    <div class="floating-emoji">🌈</div>
    <div class="floating-emoji">🦋</div>
    <div class="floating-emoji">🌸</div>
    <div class="floating-emoji">✨</div>
    <div class="floating-emoji">💖</div>

    <!-- ─── Canvas for interactive particles ─── -->
    <canvas id="happiness-canvas"></canvas>

    <!-- ─── Main content ─── -->
    <div class="container">
        <h1 class="main-title">
            <span class="rainbow-text">You are loved</span>
        </h1>
        <div class="subtitle">✨ happiness is just a click away ✨</div>

        <div class="message-box">
            <div id="message">
                <span class="message-emoji">🌟</span>
                <span id="message-text">You make the world brighter!</span>
            </div>
        </div>

        <button class="btn" id="happyBtn">
            <span class="btn-icon">🎉</span>
            Make me happy!
        </button>
    </div>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  1. HAPPY MESSAGES
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const messages = [
            { emoji: '🌟', text: 'You make the world brighter!' },
            { emoji: '💖', text: 'You are absolutely amazing!' },
            { emoji: '🌈', text: 'Your smile is contagious!' },
            { emoji: '🦋', text: 'You are capable of incredible things!' },
            { emoji: '✨', text: 'You shine like a star!' },
            { emoji: '🌸', text: 'You bring beauty everywhere you go!' },
            { emoji: '🎈', text: 'You are a gift to the world!' },
            { emoji: '🌺', text: 'Your kindness makes a difference!' },
            { emoji: '💫', text: 'You are enough, just as you are!' },
            { emoji: '🏆', text: 'You are a champion of happiness!' },
            { emoji: '🍀', text: 'You are lucky to be you!' },
            { emoji: '🎶', text: 'Your heart sings a beautiful tune!' },
            { emoji: '🌻', text: 'You radiate positivity!' },
            { emoji: '💎', text: 'You are precious and unique!' },
            { emoji: '🌊', text: 'You are as deep and wonderful as the ocean!' },
        ];

        const messageEmoji = document.querySelector('.message-emoji');
        const messageText = document.getElementById('message-text');
        const happyBtn = document.getElementById('happyBtn');

        function showRandomMessage() {
            const random = messages[Math.floor(Math.random() * messages.length)];
            messageEmoji.textContent = random.emoji;
            messageText.textContent = random.text;

            // Trigger burst of hearts/particles
            createHeartBurst();
        }

        happyBtn.addEventListener('click', showRandomMessage);

        // Show initial random message on load
        setTimeout(showRandomMessage, 600);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  2. CANVAS: floating particles + heart burst
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const canvas = document.getElementById('happiness-canvas');
        const ctx = canvas.getContext('2d');

        let W, H;
        let particles = [];
        const MAX_PARTICLES = 180;
        const MOUSE_RADIUS = 140;

        let mouseX = -9999;
        let mouseY = -9999;
        let isMouseOnCanvas = false;

        function resizeCanvas() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ── Particle class (floating dots) ──
        class Particle {
            constructor() {
                this.reset();
                this.x = Math.random() * W;
                this.y = Math.random() * H;
                this.size = Math.random() * 4 + 1;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.5 + 0.3;
                const colors = [
                    '255, 59, 138',
                    '123, 47, 252',
                    '0, 212, 255',
                    '255, 107, 53',
                    '255, 217, 61',
                    '107, 203, 119',
                    '255, 100, 200',
                ];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.life = 1;
                this.decay = 0.001 + Math.random() * 0.003;
                this.wobble = Math.random() * 100;
                this.wobbleSpeed = 0.01 + Math.random() * 0.02;
                this.isNew = true;
            }

            reset() {
                this.x = Math.random() * W;
                this.y = Math.random() * H;
                this.size = Math.random() * 4 + 1;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.5 + 0.3;
                const colors = [
                    '255, 59, 138',
                    '123, 47, 252',
                    '0, 212, 255',
                    '255, 107, 53',
                    '255, 217, 61',
                    '107, 203, 119',
                    '255, 100, 200',
                ];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.life = 1;
                this.decay = 0.001 + Math.random() * 0.003;
                this.wobble = Math.random() * 100;
                this.wobbleSpeed = 0.01 + Math.random() * 0.02;
                this.isNew = true;
            }

            update() {
                if (isMouseOnCanvas) {
                    const dx = this.x - mouseX;
                    const dy = this.y - mouseY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < MOUSE_RADIUS && dist > 0) {
                        const force = (MOUSE_RADIUS - dist) / MOUSE_RADIUS;
                        const angle = Math.atan2(dy, dx);
                        const push = force * 1.5;
                        this.x += Math.cos(angle) * push;
                        this.y += Math.sin(angle) * push;
                        this.speedX += Math.cos(angle) * force * 0.2;
                        this.speedY += Math.sin(angle) * force * 0.2;
                    }
                }

                this.wobble += this.wobbleSpeed;
                const wobX = Math.sin(this.wobble) * 0.12;
                const wobY = Math.cos(this.wobble * 0.7) * 0.12;

                this.x += this.speedX + wobX;
                this.y += this.speedY + wobY;

                this.speedX *= 0.998;
                this.speedY *= 0.998;

                if (this.x < -30) this.x = W + 30;
                if (this.x > W + 30) this.x = -30;
                if (this.y < -30) this.y = H + 30;
                if (this.y > H + 30) this.y = -30;

                this.life -= this.decay;
                if (this.life < 0.1) {
                    this.life = 1;
                    this.isNew = true;
                    const colors = [
                        '255, 59, 138',
                        '123, 47, 252',
                        '0, 212, 255',
                        '255, 107, 53',
                        '255, 217, 61',
                        '107, 203, 119',
                        '255, 100, 200',
                    ];
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                }
                this.isNew = false;
            }

            draw() {
                const alpha = this.opacity * (0.3 + 0.7 * this.life);

                // Glow
                const gradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.size * 4
                );
                gradient.addColorStop(0, `rgba(${this.color}, ${alpha * 0.8})`);
                gradient.addColorStop(0.4, `rgba(${this.color}, ${alpha * 0.3})`);
                gradient.addColorStop(1, `rgba(${this.color}, 0)`);

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 4, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();

                // Core
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 0.5, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${alpha * 0.6})`;
                ctx.fill();
            }
        }

        // ── Heart burst particles ──
        let heartParticles = [];

        class HeartParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = 12 + Math.random() * 20;
                this.speedX = (Math.random() - 0.5) * 18;
                this.speedY = (Math.random() - 0.5) * 18 - 6;
                this.gravity = 0.25;
                this.life = 1;
                this.decay = 0.008 + Math.random() * 0.012;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.2;
                this.emoji = ['💖', '❤️', '💕', '💗', '💓', '🩷', '♥️'][Math.floor(Math.random() * 7)];
                this.opacity = 0.9 + Math.random() * 0.1;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.speedY += this.gravity;
                this.speedX *= 0.99;
                this.life -= this.decay;
                this.rotation += this.rotSpeed;
                this.opacity = this.life * 0.9;
            }

            draw() {
                if (this.life <= 0) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.font = `${this.size}px "Segoe UI Emoji", "Apple Color Emoji", system-ui, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.globalAlpha = this.opacity;
                ctx.fillText(this.emoji, 0, 0);
                ctx.restore();
            }
        }

        // ── Init particles ──
        for (let i = 0; i < MAX_PARTICLES; i++) {
            particles.push(new Particle());
        }

        // ── Mouse tracking ──
        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            isMouseOnCanvas = true;
        });
        window.addEventListener('mouseleave', () => {
            isMouseOnCanvas = false;
        });

        window.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            if (touch) {
                mouseX = touch.clientX;
                mouseY = touch.clientY;
                isMouseOnCanvas = true;
            }
        }, { passive: true });
        window.addEventListener('touchend', () => {
            isMouseOnCanvas = false;
        });

        // ── Resize ──
        window.addEventListener('resize', () => {
            resizeCanvas();
            for (const p of particles) {
                p.x = Math.min(Math.max(p.x, 0), W);
                p.y = Math.min(Math.max(p.y, 0), H);
            }
        });

        // ── Heart burst function (called on button click) ──
        function createHeartBurst() {
            const cx = W / 2;
            const cy = H / 2 - 60;
            const count = 40 + Math.floor(Math.random() * 30);
            for (let i = 0; i < count; i++) {
                heartParticles.push(new HeartParticle(cx, cy));
            }
            // Also spawn some around the button area
            const rect = happyBtn.getBoundingClientRect();
            const btnX = rect.left + rect.width / 2;
            const btnY = rect.top + rect.height / 2;
            for (let i = 0; i < 20; i++) {
                const p = new HeartParticle(
                    btnX + (Math.random() - 0.5) * 40,
                    btnY + (Math.random() - 0.5) * 20
                );
                p.speedX = (Math.random() - 0.5) * 14;
                p.speedY = (Math.random() - 0.5) * 14 - 8;
                p.size = 10 + Math.random() * 18;
                heartParticles.push(p);
            }
        }

        // ── Animation loop ──
        function animate() {
            ctx.clearRect(0, 0, W, H);

            // Draw background particles
            for (const p of particles) {
                p.update();
                p.draw();
            }

            // Draw connections
            ctx.lineWidth = 0.4;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const a = particles[i];
                    const b = particles[j];
                    const dx = a.x - b.x;
                    const dy = a.y - b.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 110) {
                        const alpha = (1 - dist / 110) * 0.15;
                        ctx.beginPath();
                        ctx.moveTo(a.x, a.y);
                        ctx.lineTo(b.x, b.y);
                        ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                        ctx.stroke();
                    }
                }
            }

            // Update and draw heart particles
            for (let i = heartParticles.length - 1; i >= 0; i--) {
                const hp = heartParticles[i];
                hp.update();
                hp.draw();
                if (hp.life <= 0) {
                    heartParticles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();

        // ── Periodic particle refresh ──
        setInterval(() => {
            if (particles.length < MAX_PARTICLES + 20) {
                for (let i = 0; i < 3; i++) {
                    particles.push(new Particle());
                }
            }
            if (particles.length > MAX_PARTICLES + 30) {
                particles.splice(0, particles.length - MAX_PARTICLES);
            }
        }, 2000);

        // ── Click on canvas also triggers burst (optional) ──
        document.addEventListener('click', (e) => {
            // Only if not clicking on button or message box
            if (!e.target.closest('.btn') && !e.target.closest('.message-box')) {
                // Create a small burst at click location
                const cx = e.clientX;
                const cy = e.clientY;
                for (let i = 0; i < 15; i++) {
                    const p = new HeartParticle(cx, cy);
                    p.speedX = (Math.random() - 0.5) * 12;
                    p.speedY = (Math.random() - 0.5) * 12 - 4;
                    p.size = 10 + Math.random() * 16;
                    heartParticles.push(p);
                }
            }
        });

        console.log('✨ Happiness Generator loaded — spread joy!');
    </script>
</body>
</html>
