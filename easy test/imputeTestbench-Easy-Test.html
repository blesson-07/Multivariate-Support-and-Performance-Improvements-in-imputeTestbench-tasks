<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>we all love delulu</title>
    <style>
        /* ── Reset & base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0015;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            overflow: hidden;
            position: relative;
            user-select: none;
        }

        /* ── Animated gradient background ── */
        .bg-gradient {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: linear-gradient(135deg, #0a0015, #1a0030, #2d004d, #1a0030, #0a0015);
            background-size: 600% 600%;
            animation: gradientShift 12s ease-in-out infinite alternate;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* ── Floating orbs / glow blobs ── */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
            animation: orbFloat 18s ease-in-out infinite alternate;
            pointer-events: none;
        }
        .orb--1 {
            width: 500px;
            height: 500px;
            top: -10%;
            left: -5%;
            background: #ff6ec7;
            animation-delay: 0s;
        }
        .orb--2 {
            width: 600px;
            height: 600px;
            bottom: -15%;
            right: -10%;
            background: #7b2ffc;
            animation-delay: -6s;
        }
        .orb--3 {
            width: 400px;
            height: 400px;
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            background: #00d4ff;
            animation-delay: -12s;
            opacity: 0.25;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(40px, -30px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 40px) scale(0.9);
            }
            100% {
                transform: translate(30px, -20px) scale(1.05);
            }
        }

        /* ── Main content ── */
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
            animation: fadeInUp 1.6s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(60px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ── Main heading ── */
        .main-title {
            font-size: clamp(3rem, 14vw, 8rem);
            font-weight: 900;
            letter-spacing: -0.03em;
            line-height: 1.1;
            color: #fff;
            text-shadow:
                0 0 20px rgba(255, 110, 199, 0.5),
                0 0 60px rgba(123, 47, 252, 0.4),
                0 0 120px rgba(0, 212, 255, 0.2);
            animation: titleGlow 3s ease-in-out infinite alternate;
            position: relative;
            display: inline-block;
        }

        @keyframes titleGlow {
            0% {
                text-shadow:
                    0 0 20px rgba(255, 110, 199, 0.5),
                    0 0 60px rgba(123, 47, 252, 0.4),
                    0 0 120px rgba(0, 212, 255, 0.2);
                transform: scale(1);
            }
            100% {
                text-shadow:
                    0 0 30px rgba(255, 110, 199, 0.9),
                    0 0 80px rgba(123, 47, 252, 0.7),
                    0 0 160px rgba(0, 212, 255, 0.4);
                transform: scale(1.02);
            }
        }

        /* ── Rainbow text overlay (gradient text) ── */
        .rainbow-text {
            background: linear-gradient(90deg,
                    #ff6ec7, #ff3b8a, #ff6ec7,
                    #a855f7, #7b2ffc, #3b82f6,
                    #06b6d4, #34d399, #fbbf24,
                    #f97316, #ff6ec7);
            background-size: 400% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: rainbowFlow 6s linear infinite;
            display: inline-block;
        }

        @keyframes rainbowFlow {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 400% 50%;
            }
        }

        /* ── Subtitle / tagline ── */
        .subtitle {
            font-size: clamp(1rem, 2.5vw, 1.8rem);
            font-weight: 300;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 1.2rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            animation: pulseSub 3s ease-in-out infinite;
            backdrop-filter: blur(4px);
            padding: 0.4rem 1.6rem;
            border-radius: 40px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
        }

        @keyframes pulseSub {
            0%,
            100% {
                opacity: 0.6;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.03);
            }
        }

        /* ── Emoji / symbol row ── */
        .emoji-row {
            margin-top: 2.2rem;
            font-size: clamp(2rem, 5vw, 3.6rem);
            display: flex;
            gap: 0.8rem 1.8rem;
            flex-wrap: wrap;
            justify-content: center;
            animation: floatEmojis 4s ease-in-out infinite alternate;
        }

        .emoji-row span {
            display: inline-block;
            animation: emojiPop 2.4s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 12px rgba(255, 110, 199, 0.3));
            transition: transform 0.2s;
            cursor: default;
        }

        .emoji-row span:hover {
            transform: scale(1.4) rotate(8deg);
        }

        .emoji-row span:nth-child(1) {
            animation-delay: 0s;
        }
        .emoji-row span:nth-child(2) {
            animation-delay: 0.3s;
        }
        .emoji-row span:nth-child(3) {
            animation-delay: 0.6s;
        }
        .emoji-row span:nth-child(4) {
            animation-delay: 0.9s;
        }
        .emoji-row span:nth-child(5) {
            animation-delay: 1.2s;
        }
        .emoji-row span:nth-child(6) {
            animation-delay: 1.5s;
        }
        .emoji-row span:nth-child(7) {
            animation-delay: 1.8s;
        }

        @keyframes emojiPop {
            0% {
                transform: translateY(0) scale(1) rotate(0deg);
            }
            100% {
                transform: translateY(-14px) scale(1.12) rotate(6deg);
            }
        }

        @keyframes floatEmojis {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(-8px);
            }
        }

        /* ── Sparkle particles (canvas) ── */
        #particles-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            width: 100%;
            height: 100%;
        }

        /* ── Responsive tweaks ── */
        @media (max-width: 600px) {
            .subtitle {
                letter-spacing: 0.15em;
                font-size: 0.9rem;
                padding: 0.3rem 1rem;
            }
            .emoji-row {
                gap: 0.4rem 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Background layers -->
    <div class="bg-gradient"></div>
    <div class="orb orb--1"></div>
    <div class="orb orb--2"></div>
    <div class="orb orb--3"></div>

    <!-- Particle canvas -->
    <canvas id="particles-canvas"></canvas>

    <!-- Main content -->
    <div class="container">
        <h1 class="main-title">
            <span class="rainbow-text">we all love delulu</span>
        </h1>
        <div class="subtitle">✨ forever & always ✨</div>
        <div class="emoji-row">
            <span>🦄</span>
            <span>💖</span>
            <span>✨</span>
            <span>🌈</span>
            <span>🌟</span>
            <span>💫</span>
            <span>🫶</span>
        </div>
    </div>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  Sparkle / Particle system
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');

        let W, H;
        let particles = [];
        const MAX_PARTICLES = 140;
        const MOUSE_RADIUS = 120;

        let mouseX = -9999;
        let mouseY = -9999;
        let isMouseOnCanvas = false;

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // ── Particle class ──
        class Particle {
            constructor() {
                this.reset();
                // give some variety at birth
                this.x = Math.random() * W;
                this.y = Math.random() * H;
                this.size = Math.random() * 3.5 + 1.2;
                this.speedX = (Math.random() - 0.5) * 0.6;
                this.speedY = (Math.random() - 0.5) * 0.6;
                this.opacity = Math.random() * 0.7 + 0.3;
                // color: pick from a dreamy palette
                const colors = [
                    '255, 110, 199', // pink
                    '123, 47, 252', // purple
                    '0, 212, 255', // cyan
                    '255, 59, 138', // hot pink
                    '168, 85, 247', // violet
                    '251, 191, 36', // gold
                    '52, 211, 153', // mint
                ];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.life = 1;
                this.decay = 0.001 + Math.random() * 0.003;
                this.isNew = true;
            }

            reset() {
                this.x = Math.random() * W;
                this.y = Math.random() * H;
                this.size = Math.random() * 3.5 + 1.2;
                this.speedX = (Math.random() - 0.5) * 0.6;
                this.speedY = (Math.random() - 0.5) * 0.6;
                this.opacity = Math.random() * 0.7 + 0.3;
                const colors = [
                    '255, 110, 199',
                    '123, 47, 252',
                    '0, 212, 255',
                    '255, 59, 138',
                    '168, 85, 247',
                    '251, 191, 36',
                    '52, 211, 153',
                ];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.life = 1;
                this.decay = 0.001 + Math.random() * 0.003;
                this.isNew = true;
            }

            update() {
                // mouse interaction: gentle repulsion or attraction?
                if (isMouseOnCanvas) {
                    const dx = this.x - mouseX;
                    const dy = this.y - mouseY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < MOUSE_RADIUS && dist > 0) {
                        const force = (MOUSE_RADIUS - dist) / MOUSE_RADIUS;
                        const angle = Math.atan2(dy, dx);
                        const push = force * 1.2;
                        this.x += Math.cos(angle) * push;
                        this.y += Math.sin(angle) * push;
                    }
                }

                this.x += this.speedX;
                this.y += this.speedY;

                // gentle drift
                this.speedX += (Math.random() - 0.5) * 0.02;
                this.speedY += (Math.random() - 0.5) * 0.02;
                this.speedX *= 0.999;
                this.speedY *= 0.999;

                // wrap around edges
                if (this.x < -20) this.x = W + 20;
                if (this.x > W + 20) this.x = -20;
                if (this.y < -20) this.y = H + 20;
                if (this.y > H + 20) this.y = -20;

                // life / opacity shimmer
                this.life -= this.decay;
                if (this.life < 0.1) {
                    this.life = 1;
                    this.isNew = true;
                    // refresh color occasionally
                    const colors = [
                        '255, 110, 199',
                        '123, 47, 252',
                        '0, 212, 255',
                        '255, 59, 138',
                        '168, 85, 247',
                        '251, 191, 36',
                        '52, 211, 153',
                    ];
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                }
                this.isNew = false;
            }

            draw() {
                const alpha = this.opacity * (0.4 + 0.6 * this.life);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);

                // glow
                const gradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.size * 4
                );
                gradient.addColorStop(0, `rgba(${this.color}, ${alpha * 0.9})`);
                gradient.addColorStop(0.4, `rgba(${this.color}, ${alpha * 0.4})`);
                gradient.addColorStop(1, `rgba(${this.color}, 0)`);

                ctx.fillStyle = gradient;
                ctx.fill();

                // core dot
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 0.5, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.7})`;
                ctx.fill();

                // tiny sparkle cross
                if (this.size > 2.2 && Math.random() < 0.02) {
                    ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.2})`;
                    ctx.lineWidth = 0.8;
                    const s = this.size * 1.8;
                    ctx.beginPath();
                    ctx.moveTo(this.x - s, this.y);
                    ctx.lineTo(this.x + s, this.y);
                    ctx.moveTo(this.x, this.y - s);
                    ctx.lineTo(this.x, this.y + s);
                    ctx.stroke();
                }
            }
        }

        // ── Init particles ──
        for (let i = 0; i < MAX_PARTICLES; i++) {
            particles.push(new Particle());
        }

        // ── Mouse tracking ──
        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            isMouseOnCanvas = true;
        });
        window.addEventListener('mouseleave', () => {
            isMouseOnCanvas = false;
        });

        // Touch support
        window.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            if (touch) {
                mouseX = touch.clientX;
                mouseY = touch.clientY;
                isMouseOnCanvas = true;
            }
        }, { passive: true });
        window.addEventListener('touchend', () => {
            isMouseOnCanvas = false;
        });

        // ── Animation loop ──
        function animate() {
            ctx.clearRect(0, 0, W, H);

            // Update & draw each particle
            for (const p of particles) {
                p.update();
                p.draw();
            }

            // Draw connecting lines between nearby particles (only if close)
            ctx.lineWidth = 0.5;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const a = particles[i];
                    const b = particles[j];
                    const dx = a.x - b.x;
                    const dy = a.y - b.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 110) {
                        const alpha = (1 - dist / 110) * 0.25;
                        ctx.beginPath();
                        ctx.moveTo(a.x, a.y);
                        ctx.lineTo(b.x, b.y);
                        ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(animate);
        }

        animate();

        // ── Resize handler for particles ──
        window.addEventListener('resize', () => {
            resize();
            // reposition particles that are out of bounds
            for (const p of particles) {
                p.x = Math.min(Math.max(p.x, 0), W);
                p.y = Math.min(Math.max(p.y, 0), H);
            }
        });

        // ── Bonus: add a few new particles periodically ──
        setInterval(() => {
            if (particles.length < MAX_PARTICLES + 20) {
                for (let i = 0; i < 3; i++) {
                    particles.push(new Particle());
                }
            }
            // trim if too many
            if (particles.length > MAX_PARTICLES + 30) {
                particles.splice(0, particles.length - MAX_PARTICLES);
            }
        }, 2000);
    </script>
</body>
</html>
